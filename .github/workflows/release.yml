name: Publish Release

# Only a manually approved workflow run on main creates a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v, e.g. 0.2.0 or 0.3.0-beta.1'
        type: string
        required: true
      prerelease:
        description: 'Publish as pre-release (must match alpha/beta/rc suffix)'
        type: boolean
        default: true
        required: true

permissions:
  contents: write

concurrency:
  group: psdyndns-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 18
    # Use modern PowerShell for release orchestration and packaging.
    # Only the explicit Windows PowerShell 5.1 verification steps use powershell.exe.
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enforce main and validate version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Releases must be dispatched from main.' }
          $v = $env:REQUESTED_VERSION
          if ($v -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(alpha|beta|rc)\.([1-9][0-9]*))?$') {
            throw 'Invalid version. Use 1.2.3 or 1.2.3-beta.1 (alpha and rc also supported).'
          }
          $hasSuffix = [bool]$Matches[4]
          if ($hasSuffix -ne ($env:PRERELEASE -eq 'true')) {
            throw 'Pre-release checkbox must agree with the version suffix.'
          }
          "TAG=v$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure release tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # PowerShell 5.1 treats gh CLI stderr (including expected HTTP 404)
          # as a terminating error with ErrorActionPreference=Stop.
          # Only HTTP 404 means the tag is available; all other API errors fail.
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'PSDynDNS-Release'
          }
          $exists = $false
          try {
            $null = Invoke-RestMethod -Uri $url -Method Get -Headers $headers -TimeoutSec 30 -ErrorAction Stop
            $exists = $true
          } catch {
            $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($status -ne 404) { throw }
          }
          if ($exists) { throw "Tag $env:TAG already exists." }
      - name: Check PowerShell 5.1 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('PSDynDNS.ps1', 'Install-PSDynDNS.ps1')) {
            $tokens = $null
            $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              foreach ($e in $errors) { Write-Host ("$file {0}:{1} {2}" -f $e.Extent.StartLineNumber,$e.Extent.StartColumnNumber,$e.Message) }
              throw "PowerShell parser failed: $file"
            }
          }
      - name: Install Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99 -Force -Scope CurrentUser -SkipPublisherCheck -Confirm:$false
          Import-Module Pester -MinimumVersion 5.0 -ErrorAction Stop
      - name: Run Pester tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pesterConfig = New-PesterConfiguration
          $pesterConfig.Run.Path = @('./tests/PSDynDNS.Tests.ps1','./tests/PSDynDNS.Behavior.Tests.ps1','./tests/Integration.SelfUpdate.Tests.ps1','./tests/Integration.Windows.Tests.ps1')
          $pesterConfig.Run.PassThru = $true
          $pesterConfig.Output.Verbosity = 'Detailed'
          $pesterConfig.CodeCoverage.Enabled = $true
          $pesterConfig.CodeCoverage.Path = @('./PSDynDNS.ps1','./Install-PSDynDNS.ps1')
          $result = Invoke-Pester -Configuration $pesterConfig
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { throw 'Pester suite failed.' }
      - name: Install Pester for PowerShell 7
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99 -Scope CurrentUser -Force -Confirm:$false
          }
          Import-Module Pester -MinimumVersion 5.0
      - name: Run PowerShell 7 compatibility tests
        run: |
          $ErrorActionPreference = 'Stop'
          $pesterConfig = New-PesterConfiguration
          $pesterConfig.Run.Path = @('./tests/PSDynDNS.Tests.ps1','./tests/PSDynDNS.Behavior.Tests.ps1','./tests/Integration.SelfUpdate.Tests.ps1','./tests/Integration.Windows.Tests.ps1')
          $pesterConfig.Run.PassThru = $true
          $pesterConfig.Output.Verbosity = 'Detailed'
          $pesterConfig.CodeCoverage.Enabled = $true
          $pesterConfig.CodeCoverage.Path = @('./PSDynDNS.ps1','./Install-PSDynDNS.ps1')
          $result = Invoke-Pester -Configuration $pesterConfig
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { throw 'PowerShell 7 tests failed.' }
      - name: Stamp release version after complete Pester suite
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'PSDynDNS.ps1'
          $source = [IO.File]::ReadAllText($path)
          $needle = [regex]::Escape("$" + "script:Version = '0.1.0-dev'")
          if ([regex]::Matches($source, $needle).Count -ne 1) { throw 'Expected exactly one version placeholder.' }
          $result = $source.Replace("$" + "script:Version = '0.1.0-dev'", "$" + "script:Version = '$env:VERSION'")
          [IO.File]::WriteAllText($path, $result, (New-Object System.Text.UTF8Encoding($false)))
          $tokens = $null
          $parseErrors = $null
          $null = [Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count) { throw 'Version-stamped release script failed PowerShell parsing.' }
      - name: Package standalone files, zip and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item PSDynDNS.ps1,Install-PSDynDNS.ps1 -Destination dist
          $zip = "dist/PSDynDNS-$env:TAG.zip"
          Compress-Archive -Path PSDynDNS.ps1,Install-PSDynDNS.ps1,config.example.json,README.md,LICENSE -DestinationPath $zip -Force
          $names = @('PSDynDNS.ps1','Install-PSDynDNS.ps1',("PSDynDNS-$env:TAG.zip"))
          $lines = @($names | ForEach-Object {
            $sum = (Get-FileHash (Join-Path dist $_) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sum  $_"
          })
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS.txt'),$lines,(New-Object Text.UTF8Encoding($false)))
      - name: Verify final release artifacts
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:VERSION
          $tag = $env:TAG
          $scriptPath = Join-Path $PWD 'dist/PSDynDNS.ps1'
          $zipPath = Join-Path $PWD ("dist/PSDynDNS-$tag.zip")
          $checksumsPath = Join-Path $PWD 'dist/SHA256SUMS.txt'

          # Verify the exact file that will be published, not only source.
          $scriptBytes = [IO.File]::ReadAllBytes($scriptPath)
          $scriptText = [Text.Encoding]::UTF8.GetString($scriptBytes)
          $versionLines = @(
            [regex]::Matches($scriptText, '(?m)^\$script:Version\s*=\s*''([^'']+)''\s*        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $args = @('release','create',$env:TAG,'dist/PSDynDNS.ps1','dist/Install-PSDynDNS.ps1',("dist/PSDynDNS-$env:TAG.zip"),'dist/SHA256SUMS.txt','--repo',$env:GITHUB_REPOSITORY,'--target',$env:GITHUB_SHA,'--title',("PSDynDNS "+$env:TAG),'--draft','--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $args += '--prerelease' }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Draft release exists, but publishing failed.' }
)
          )
          if ($versionLines.Count -ne 1 -or $versionLines[0].Groups[1].Value -cne $expected) {
            throw "Published client does not contain exactly the expected version $expected."
          }
          if ($scriptText.Contains("$" + "script:Version = '0.1.0-dev'")) {
            throw 'Unstamped development version remains in the published client.'
          }

          Add-Type -AssemblyName System.IO.Compression
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($zip.Entries | Where-Object { $_.FullName -eq 'PSDynDNS.ps1' })
            if ($entries.Count -ne 1) { throw 'Release ZIP must contain one PSDynDNS.ps1.' }
            $stream = $entries[0].Open()
            $buffer = New-Object IO.MemoryStream
            try { $stream.CopyTo($buffer); $zippedBytes = $buffer.ToArray() }
            finally { $stream.Dispose(); $buffer.Dispose() }
            if ($zippedBytes.Length -ne $scriptBytes.Length -or
                -not [Linq.Enumerable]::SequenceEqual(
                    [byte[]]$zippedBytes, [byte[]]$scriptBytes
                )) {
                throw 'Client inside ZIP differs from the standalone release asset.'
            }
          } finally {
            $zip.Dispose()
          }

          $manifest = @(Get-Content -LiteralPath $checksumsPath -Encoding UTF8)
          foreach ($name in @('PSDynDNS.ps1','Install-PSDynDNS.ps1',"PSDynDNS-$tag.zip")) {
            $actual = (Get-FileHash -LiteralPath (Join-Path $PWD "dist/$name") -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = "$actual  $name"
            if (@($manifest | Where-Object { $_ -ceq $line }).Count -ne 1) {
              throw "SHA256SUMS.txt does not match $name."
            }
          }
          Write-Host "Validated release version $expected, ZIP contents and SHA-256 sums."

      - name: Publish release (create draft first)
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $args = @('release','create',$env:TAG,'dist/PSDynDNS.ps1','dist/Install-PSDynDNS.ps1',("dist/PSDynDNS-$env:TAG.zip"),'dist/SHA256SUMS.txt','--repo',$env:GITHUB_REPOSITORY,'--target',$env:GITHUB_SHA,'--title',("PSDynDNS "+$env:TAG),'--draft','--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $args += '--prerelease' }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Draft release exists, but publishing failed.' }
